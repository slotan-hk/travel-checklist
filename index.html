<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slotan 行李清單</title>
<meta name="theme-color" content="#FEF4DC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08233A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行李清單">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* 配色取自 Slotan 會徽：忌廉底、深藍粗邊、黃色字、珊瑚紅絲帶、棋子藍 */
  :root {
    --paper: #FEF4DC;
    --surface: #FFFDF6;
    --ink: #083C63;
    --muted: #55728C;
    --outline: #083C63;
    --rule: #EBDDBB;
    --yellow: #FDC66B;
    --yellow-soft: #FFE9B8;
    --blue: #3F7DAB;
    --coral: #CF4F63;
    --green: #A7AE6A;
    --pink: #F5939A;
    --on-blue: #FFFFFF;
    --toast-bg: #083C63; --toast-ink: #FEF2D8; --toast-act: #FDC66B;
    --radius: 18px;
    --bar-h: 112px;
    --head-font: "Fredoka", system-ui, -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #08233A;
      --surface: #0D3252;
      --ink: #FEF2D8;
      --muted: #A3B9CB;
      --outline: #6F97B8;
      --rule: #1C4669;
      --yellow: #FDC66B;
      --yellow-soft: #3B4A45;
      --blue: #5B9BCB;
      --coral: #FF8E9B;
      --green: #B9C07C;
      --pink: #F5939A;
      --on-blue: #06263F;
      --toast-bg: #FEF2D8; --toast-ink: #083C63; --toast-act: #1F5F8F;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "PingFang HK", "Noto Sans HK", "Microsoft JhengHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 8px; }

  .app { max-width: 640px; margin: 0 auto; padding: 14px 14px 120px; }

  /* 像桌遊板塊的卡：粗邊 + 實色底影 */
  .tile {
    background: var(--surface);
    border: 2px solid var(--outline);
    border-radius: var(--radius);
    box-shadow: 0 4px 0 var(--outline);
  }

  /* ── 頁首：會徽 + 進度 ── */
  .hero { text-align: center; }
  .logo {
    position: relative; z-index: 1;
    display: block; width: min(250px, 66vw); height: auto; aspect-ratio: 440 / 329;
    margin: 0 auto -30px;
  }
  .progress-card { text-align: left; padding: 38px 18px 18px; }
  .tag-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .hero h1 { margin: 0; font: 700 26px/1.2 var(--head-font); letter-spacing: .03em; }
  .save { font-size: 13px; color: var(--muted); white-space: nowrap; background: none; border: 0; padding: 0; cursor: default; }
  .save[data-state="error"] { color: var(--coral); text-decoration: underline; cursor: pointer; }
  .tag-count { margin: 2px 0 0; font: 500 15px/1.5 var(--head-font); font-variant-numeric: tabular-nums; }
  .tag-count b { font-size: 21px; font-weight: 700; }

  /* 登入後：頁首縮成一行（會徽在左、進度在右），把空間留給清單 */
  body[data-view="app"] .hero { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 10px; text-align: left; }
  body[data-view="app"] .logo { width: 88px; margin: 0; }
  body[data-view="app"] .progress-card { position: relative; padding: 10px 16px 14px; }
  body[data-view="app"] .hero h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  body[data-view="app"] .tag-top { position: absolute; top: 14px; right: 16px; }
  body[data-view="app"] .tag-count { margin: 0; padding-right: 64px; }
  body[data-view="app"] .track-wrap { padding-top: 26px; }
  body[data-view="app"] .pawn { top: 0; width: 22px; height: 28px; }

  /* 進度：棋子沿著軌道行向終點的星 */
  .track-wrap { position: relative; padding-top: 30px; margin: 0 16px 0 6px; }
  .track { height: 16px; border-radius: 99px; border: 2px solid var(--outline); background: var(--paper); overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--yellow); border-right: 2px solid var(--outline); transition: width .4s ease; }
  .fill[data-zero] { border-right: 0; }
  .pawn { position: absolute; top: 2px; left: 0; width: 24px; height: 30px; transform: translateX(-50%); transition: left .4s ease; }
  .goal { position: absolute; right: -16px; bottom: -5px; width: 26px; height: 26px; }
  .pawn .shape, .goal .shape { stroke: var(--outline); stroke-width: 2; stroke-linejoin: round; }
  .pawn .shape { fill: var(--pink); }
  .goal .shape { fill: var(--yellow); }

  /* ── 登入 ── */
  body[data-view="auth"] .progress-card, body[data-view="auth"] .bar,
  body[data-view="auth"] #list, body[data-view="auth"] #addCat { display: none; }
  body[data-view="app"] .auth { display: none; }
  .auth { text-align: left; padding: 40px 18px 20px; }
  .auth h1 { margin: 0; font: 700 26px/1.2 var(--head-font); letter-spacing: .03em; }
  .auth-lead { margin: 6px 0 16px; color: var(--muted); font-size: 15px; }
  .auth .seg { display: flex; }
  .auth .seg button { flex: 1; min-height: 44px; }
  .auth form { margin-top: 16px; display: grid; gap: 12px; }
  .field { display: grid; gap: 4px; font: 600 14px/1.4 var(--head-font); }
  .field input {
    border: 2px solid var(--outline); background: var(--paper); border-radius: 12px;
    padding: 10px 12px; min-height: 48px; font-weight: 400; font-size: 16px;
  }
  .field input:focus { outline: 3px solid var(--blue); outline-offset: 1px; }
  .auth-hint { margin: 0; font-size: 13px; color: var(--muted); }
  .auth-err { margin: 0; font-size: 14px; font-weight: 600; color: var(--coral); }
  .auth-err:empty { display: none; }
  .btn.primary { background: var(--yellow); color: #083C63; font-size: 17px; min-height: 50px; }
  .btn[disabled] { opacity: .6; cursor: progress; }

  .demo-note {
    margin: 14px 0 0; padding: 10px 12px; font-size: 14px;
    border: 2px dashed var(--muted); border-radius: 12px; color: var(--muted);
  }

  /* ── 固定工具列 ── */
  .bar {
    position: sticky; top: 0; z-index: 5;
    margin: 6px -14px 0; padding: 10px 14px 8px;
    background: var(--paper);
  }
  .bar::after {             /* 向下捲動後，工具列底部變成迷你進度條 */
    content: ""; position: absolute; left: 0; bottom: 0; height: 4px;
    width: calc(var(--pct, 0) * 1%); background: var(--blue);
    opacity: 0; transition: width .4s ease, opacity .2s;
  }
  .bar.stuck { box-shadow: 0 2px 0 var(--rule); }
  .bar.stuck::after { opacity: 1; }
  .bar-row { display: flex; align-items: center; gap: 8px; }
  .seg { display: inline-flex; border: 2px solid var(--outline); border-radius: 14px; background: var(--surface); overflow: hidden; }
  .seg button {
    border: 0; background: transparent; padding: 6px 14px;
    font: 600 15px/1.4 var(--head-font); color: var(--muted); min-height: 40px;
  }
  .seg button + button { border-left: 2px solid var(--outline); }
  .seg button[aria-pressed="true"] { background: var(--yellow); color: #083C63; }
  .spacer { flex: 1; }
  .btn {
    border: 2px solid var(--outline); background: var(--surface);
    padding: 6px 14px; border-radius: 14px; min-height: 44px;
    font: 600 15px/1.4 var(--head-font);
    box-shadow: 0 3px 0 var(--outline);
    transition: transform .08s, box-shadow .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--outline); }
  .btn[aria-pressed="true"] { background: var(--blue); color: var(--on-blue); }
  .btn-icon { width: 44px; padding: 0; font-size: 20px; line-height: 1; }

  .jump {
    display: flex; gap: 6px; overflow-x: auto; padding: 10px 14px 2px; margin: 0 -14px;
    scrollbar-width: none;
  }
  .jump::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; border: 1.5px solid var(--outline); background: var(--surface); color: var(--ink);
    border-radius: 99px; padding: 3px 12px; font-size: 14px; min-height: 32px; white-space: nowrap;
  }
  .chip.full { background: var(--green); color: #083C63; }
  .chip.full::before { content: "★ "; }

  /* ── 分類 ── */
  .cat { margin-top: 16px; scroll-margin-top: var(--bar-h); overflow: hidden; }
  .cat-head { display: flex; align-items: center; gap: 2px; padding-right: 12px; }
  .cat-toggle {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    border: 0; background: none; text-align: left; padding: 14px 6px 14px 16px; min-height: 52px;
  }
  .chev { flex: none; width: 10px; height: 10px; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); border-radius: 2px; transform: rotate(45deg); transition: transform .2s; margin-top: -5px; }
  .cat.folded .chev { transform: rotate(-45deg); margin-top: 0; }
  .cat-name { font: 700 18px/1.3 var(--head-font); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat-num {
    flex: none; font: 600 14px/1 var(--head-font); font-variant-numeric: tabular-nums;
    border: 1.5px solid var(--outline); border-radius: 99px; padding: 5px 10px; background: var(--paper);
  }
  .cat.full .cat-num { background: var(--green); color: #083C63; }
  .cat.skipped .cat-name { color: var(--muted); text-decoration: line-through; }
  .cat.skipped .cat-num { background: transparent; border-style: dashed; border-color: var(--muted); color: var(--muted); font-weight: 500; }
  .cat-head .skip-btn[aria-pressed="true"] svg { opacity: 1; color: var(--ink); }
  .chip.skipped { border-style: dashed; color: var(--muted); text-decoration: line-through; }
  .cat.folded .cat-body { display: none; }

  .items { list-style: none; margin: 0; padding: 0; }
  .item { display: flex; align-items: center; gap: 2px; border-top: 2px solid var(--rule); padding-right: 6px; }
  .item label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 11px 4px 11px 16px; min-height: 50px; cursor: pointer; }
  .item input[type="checkbox"] { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box {
    flex: none; width: 26px; height: 26px; border-radius: 9px;
    border: 2px solid var(--outline); background: var(--paper);
    display: grid; place-items: center;
    transition: background .15s, transform .15s;
  }
  .box::after {
    content: ""; width: 12px; height: 6px; margin-top: -3px;
    border-left: 3px solid #083C63; border-bottom: 3px solid #083C63; border-radius: 1px;
    transform: rotate(-45deg) scale(0); transition: transform .15s;
  }
  .item input:checked + .box { background: var(--yellow); transform: scale(1.08) rotate(-4deg); }
  .item input:checked + .box::after { transform: rotate(-45deg) scale(1); }
  .item input:focus-visible + .box { outline: 3px solid var(--blue); outline-offset: 2px; }
  .item-name { min-width: 0; overflow-wrap: anywhere; }
  .item.done .item-name { color: var(--muted); }
  .item.skip .item-name { color: var(--muted); text-decoration: line-through; }
  .item.skip .box { border-style: dashed; opacity: .5; }
  .skip-btn {
    flex: none; min-width: 44px; min-height: 44px; border: 0; background: none; padding: 0 4px;
    display: grid; place-items: center; color: var(--muted);
  }
  .skip-btn svg { width: 20px; height: 20px; opacity: .45; }
  .skip-btn:hover svg { opacity: .9; }
  .skip-btn[aria-pressed="true"] span {
    font-size: 12px; border: 1.5px dashed var(--muted); border-radius: 99px; padding: 2px 8px; white-space: nowrap;
  }

  /* 編輯模式 */
  .name-input {
    flex: 1; min-width: 0; border: 2px solid var(--rule); background: var(--paper);
    border-radius: 12px; padding: 7px 10px; min-height: 42px;
  }
  .name-input:focus { border-color: var(--blue); outline: none; }
  .item.editing { padding: 6px 12px 6px 16px; }
  .cat-head.editing { padding: 10px 12px 10px 16px; }
  .cat-head.editing .name-input { font: 700 17px/1.3 var(--head-font); }
  .mini {
    flex: none; border: 2px solid var(--rule); background: transparent; border-radius: 12px;
    padding: 6px 10px; font-size: 14px; min-height: 42px; color: var(--muted);
  }
  .mini[aria-pressed="true"] { background: var(--yellow-soft); color: var(--ink); border-color: var(--outline); }
  .mini.danger { color: var(--coral); border-color: currentColor; font-weight: 600; }

  /* 新增 */
  .add { display: flex; align-items: center; gap: 8px; border-top: 2px solid var(--rule); padding: 4px 12px 4px 16px; }
  .add-plus { flex: none; width: 26px; text-align: center; font: 700 22px/1 var(--head-font); color: var(--blue); }
  .add input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 4px; min-height: 46px; outline-offset: -2px; }
  .add input::placeholder { color: var(--muted); }
  .add button {
    flex: none; border: 2px solid var(--outline); background: var(--blue); color: var(--on-blue);
    border-radius: 12px; padding: 4px 14px; min-height: 38px; font: 600 15px/1.4 var(--head-font);
  }
  .add input:placeholder-shown + button { display: none; }
  .add-cat { margin-top: 18px; border: 2px dashed var(--outline); border-radius: var(--radius); }

  .state { margin-top: 28px; text-align: center; color: var(--muted); }
  .state strong { display: block; color: var(--ink); font: 700 21px/1.3 var(--head-font); margin-bottom: 4px; }
  .state .btn { margin-top: 14px; }

  /* 選單 */
  dialog {
    padding: 8px; width: min(420px, calc(100vw - 28px));
    border: 2px solid var(--outline); border-radius: 20px; box-shadow: 0 5px 0 var(--outline);
    background: var(--surface); color: var(--ink);
  }
  dialog::backdrop { background: rgba(8, 35, 58, .55); }
  .menu-item {
    display: block; width: 100%; text-align: left; border: 0; background: none;
    padding: 13px 14px; border-radius: 12px; min-height: 48px; font-size: 16px; font-weight: 600;
  }
  .menu-item small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .menu-item:hover { background: var(--yellow-soft); }
  .menu-item.danger { color: var(--coral); }
  .menu-sep { height: 2px; background: var(--rule); margin: 6px 8px; }

  /* 排列分類 */
  #sorter { max-height: 86vh; padding: 14px 10px 10px; }
  #sorter h2 { margin: 0 6px 2px; font: 700 20px/1.3 var(--head-font); }
  #sorter p { margin: 0 6px 8px; font-size: 13px; color: var(--muted); }
  .sort-list { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: calc(86vh - 150px); }
  .sort-row { display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-top: 2px solid var(--rule); }
  .sort-row.moved { background: var(--yellow-soft); }
  .sort-name { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sort-row .mini { min-width: 42px; padding: 6px 8px; color: var(--ink); border-color: var(--outline); }
  .sort-row .mini[disabled] { opacity: .25; cursor: default; }
  #sorter .btn { width: 100%; margin-top: 12px; }

  /* 提示（可復原）*/
  .toast {
    position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 160%);
    display: flex; align-items: center; gap: 14px; width: max-content; max-width: calc(100vw - 28px);
    background: var(--toast-bg); color: var(--toast-ink);
    padding: 12px 14px 12px 18px; border-radius: 16px; z-index: 20;
    transition: transform .25s ease; font-size: 15px;
  }
  .toast.show { transform: translate(-50%, 0); }
  .toast button { flex: none; white-space: nowrap; border: 0; background: none; color: var(--toast-act); font-weight: 700; padding: 6px 8px; min-height: 36px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
  }
</style>
</head>
<body data-view="auth">
<div class="app">

  <header class="hero">
    <img class="logo" id="logo" alt="Slotan 時樂殿" width="440" height="329">
    <div class="progress-card tile">
      <div class="tag-top">
        <h1>行李清單</h1>
        <button class="save" id="save" type="button" aria-live="polite"></button>
      </div>
      <p class="tag-count" id="count">載入中…</p>
      <div class="track-wrap">
        <div class="track" role="progressbar" aria-label="執行李進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
          <div class="fill" id="fill" data-zero></div>
        </div>
        <svg class="pawn" id="pawn" viewBox="0 0 24 30" aria-hidden="true">
          <path class="shape" d="M12 2a5.5 5.5 0 0 1 3.4 9.8c2.6 3.6 4.9 8.7 5.6 14.2a2 2 0 0 1-2 2.2H5a2 2 0 0 1-2-2.2c.7-5.5 3-10.6 5.6-14.2A5.5 5.5 0 0 1 12 2z"/>
        </svg>
        <svg class="goal" viewBox="0 0 26 26" aria-hidden="true">
          <path class="shape" d="M13 2.5l3.1 6.6 7.2.9-5.3 5 1.4 7.1L13 18.6 6.6 22.1 8 15l-5.3-5 7.2-.9z"/>
        </svg>
      </div>
    </div>
  </header>

  <section class="auth tile" id="auth" aria-labelledby="authTitle">
    <h1 id="authTitle">行李清單</h1>
    <p class="auth-lead">自訂一個暱稱和密碼，你的清單只有你自己看得到。</p>
    <div class="seg" role="group" aria-label="登入或建立">
      <button type="button" id="mLogin" aria-pressed="true">登入</button>
      <button type="button" id="mReg" aria-pressed="false">第一次用</button>
    </div>
    <form id="authForm">
      <label class="field">暱稱
        <input id="aUser" type="text" maxlength="20" autocomplete="username" autocapitalize="off" required>
      </label>
      <label class="field">密碼
        <input id="aPass" type="password" maxlength="100" autocomplete="current-password" required>
      </label>
      <label class="field" id="inviteRow" hidden>邀請碼
        <input id="aInvite" type="text" maxlength="40" autocomplete="off">
      </label>
      <p class="auth-hint" id="aHint"></p>
      <p class="auth-err" id="aErr" role="alert"></p>
      <button class="btn primary" type="submit" id="aSubmit">登入</button>
    </form>
  </section>

  <p class="demo-note" id="demoNote" hidden>預覽模式：未連接 Google Apps Script（未填 API_URL）。輸入任何暱稱和密碼都可以進入示範清單，改動不會儲存。</p>

  <div class="bar" id="bar">
    <div class="bar-row">
      <div class="seg" role="group" aria-label="顯示範圍">
        <button type="button" id="fAll" aria-pressed="true">全部</button>
        <button type="button" id="fTodo" aria-pressed="false">未執好</button>
      </div>
      <span class="spacer"></span>
      <button type="button" class="btn" id="editBtn" aria-pressed="false">編輯</button>
      <button type="button" class="btn btn-icon" id="menuBtn" aria-label="更多功能">⋯</button>
    </div>
    <nav class="jump" id="jump" aria-label="跳到分類"></nav>
  </div>

  <main id="list"></main>

  <form class="add add-cat" id="addCat" autocomplete="off" hidden>
    <span class="add-plus" aria-hidden="true">＋</span>
    <input type="text" maxlength="80" placeholder="新增分類，例如：滑雪用品" aria-label="新增分類">
    <button type="submit">加入</button>
  </form>
</div>

<dialog id="menu" aria-label="更多功能">
  <button class="menu-item" data-act="newTrip" type="button">開始新旅程<small>清除所有剔號和「今次唔帶」，項目保留</small></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="sort" type="button">排列分類次序<small>把常用的分類移到上面</small></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="foldToggle" id="foldToggle" type="button">收起全部分類</button>
  <div class="menu-sep"></div>
  <button class="menu-item danger" data-act="restore" type="button">還原預設清單<small>用預設清單取代你現時的清單</small></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="logout" type="button">登出<small id="whoami"></small></button>
  <div class="menu-sep"></div>
  <button class="menu-item" data-act="close" type="button">關閉</button>
</dialog>

<dialog id="sorter" aria-labelledby="sorterTitle">
  <h2 id="sorterTitle">排列分類次序</h2>
  <p>▲▼ 上下移一格，「置頂」直接移到最上。</p>
  <ol class="sort-list" id="sortList"></ol>
  <button class="btn primary" type="button" id="sorterDone">完成</button>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastMsg"></span>
  <button type="button" id="toastUndo">復原</button>
</div>

<script>
(function () {
  'use strict';

  /* ───────── 與 Apps Script 溝通（在 Apps Script 以外打開時用示範資料）───────── */
  /* ★ 放在 GitHub Pages 等外部網站時，把 Apps Script 的 /exec 網址貼在引號內 ★ */
  var API_URL = 'https://script.google.com/macros/s/AKfycbxYpcvN5n16LPf_Ml-EiQ11vAZd1mAq0YgwwXTGkhdvIASMz9pVg9-zx3KrHfwx3QfkAw/exec';

  var gas = (typeof google !== 'undefined' && google.script && google.script.run) ? google.script.run : null;
  var live = !!(gas || API_URL);         // false = 預覽模式（示範資料）

  var auth = null;                       // { user, token }，登入後每個請求都會附上
  var STORE_KEY = 'slotan_packing_auth';

  function call(fn, arg) {
    var needsAuth = (fn === 'getList' || fn === 'saveList');
    var args = needsAuth ? [auth] : [];  // 在呼叫當刻固定身分（登出時仍可完成最後一次儲存）
    if (arg !== undefined) args.push(arg);

    if (gas) {
      return new Promise(function (resolve, reject) {
        var runner = gas.withSuccessHandler(resolve).withFailureHandler(reject);
        if (args.length === 0) runner[fn](); else if (args.length === 1) runner[fn](args[0]); else runner[fn](args[0], args[1]);
      });
    }
    if (!API_URL) return mock(fn, arg);

    var body = JSON.stringify({ fn: fn, args: args });
    return fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // text/plain = 不觸發 CORS 預檢
      body: body,
      credentials: 'omit',                                       // 不帶 Google cookie → 不受多帳戶問題影響
      redirect: 'follow',
      keepalive: body.length < 15000                             // 切換 app／關閉分頁時仍能送出最後一次儲存
    }).then(function (r) {
      if (!r.ok) throw new Error('伺服器回應錯誤（' + r.status + '）。');
      return r.json();
    }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || '發生錯誤。');
      return j.data;
    });
  }

  function mock(fn, arg) {
    if (fn === 'saveList') return Promise.resolve({ ok: true });
    if (fn === 'getConfig') return Promise.resolve({ invite: false, minPass: 6 });
    if (fn === 'login' || fn === 'register') return Promise.resolve({ user: (arg && arg.user) || '示範', token: 'demo' });
    var sample = [
      ['證件', ['身份證', '護照', '旅行簽證']],
      ['錢', ['現金', '信用卡']],
      ['公會信物', ['會徽', '會服：花襯衫', '會旗：導遊旗、錦旗、橫幅', '行李牌', '錢袋']],
      ['衣服｜上身', ['睡衣', '保暖內衣', 'T-shirt', '薄外套／風褸', '厚外套', '羽絨']],
      ['電子用品', ['電話', '旅行電話卡', '耳機', '叉電線', '尿袋', '轉插']],
      ['Board Games', ['Scout', 'dnup', 'UNO Flip!', 'The Mind', 'Flip 7']]
    ];
    return Promise.resolve({
      v: 1,
      cats: sample.map(function (p) {
        return { id: uid(), name: p[0], items: p[1].map(function (n) { return { id: uid(), name: n }; }) };
      })
    });
  }

  /* ───────── 狀態 ───────── */
  var S = { v: 1, cats: [] };
  var ui = { filter: 'all', edit: false, loaded: false };

  var $ = function (id) { return document.getElementById(id); };
  var listEl = $('list'), jumpEl = $('jump');

  function uid() { return Math.random().toString(36).slice(2, 12); }

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (v == null || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c != null && c !== false) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }

  function stats(items) {
    var total = 0, done = 0;
    items.forEach(function (it) { if (!it.skip) { total++; if (it.done) done++; } });
    return { total: total, done: done };
  }

  var SKIP_ICON = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M4.8 15.2 15.2 4.8"/></svg>';

  function catState(cat) {
    var st = stats(cat.items);
    st.full = st.total > 0 && st.done === st.total;
    st.allSkip = cat.items.length > 0 && st.total === 0;       // 整個分類都標記了「今次唔帶」
    st.label = st.allSkip ? '今次唔帶' : (st.full ? '★ ' : '') + st.done + '/' + st.total;
    return st;
  }

  /* ───────── 儲存（有改動 0.7 秒後自動儲存，一次只送一個請求）───────── */
  var dirty = false, saving = false, saveTimer = null, fails = 0;

  function setSave(state) {
    var el = $('save');
    if (!live) state = 'idle';           // 預覽模式不顯示儲存狀態
    el.dataset.state = state;
    el.textContent = { saved: '已儲存', pending: '未儲存…', saving: '儲存中…', error: '儲存失敗，按此重試', idle: '' }[state];
  }
  function touch() {
    dirty = true;
    setSave('pending');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 700);
  }
  function flush() {
    clearTimeout(saveTimer);
    if (saving || !dirty || !ui.loaded) return;
    saving = true; dirty = false;
    setSave('saving');
    call('saveList', S).then(function () {
      saving = false; fails = 0;
      if (dirty) flush(); else setSave('saved');
    }, function (err) {
      saving = false; dirty = true; fails++;
      if (isAuthError(err)) return showAuth(errText(err));
      setSave('error');
      if (fails <= 5) saveTimer = setTimeout(flush, 5000);
    });
  }
  $('save').addEventListener('click', function () { if (this.dataset.state === 'error') flush(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) flush(); });

  /* ───────── 可復原的操作 ───────── */
  var toastTimer = null, undoFn = null;
  function toast(msg, onUndo) {
    $('toastMsg').textContent = msg;
    undoFn = onUndo || null;
    $('toastUndo').hidden = !onUndo;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast() { $('toast').classList.remove('show'); undoFn = null; }
  $('toastUndo').addEventListener('click', function () { var fn = undoFn; hideToast(); if (fn) fn(); });

  function undoable(msg, mutate) {
    var snapshot = JSON.stringify(S);
    mutate();
    touch(); render();
    toast(msg, function () { S = JSON.parse(snapshot); touch(); render(); });
  }

  /* ───────── 畫面 ───────── */
  function renderHeader() {
    var all = [];
    S.cats.forEach(function (c) { all = all.concat(c.items); });
    var st = stats(all);
    var pct = st.total ? Math.round(st.done / st.total * 100) : 0;
    var count = $('count');
    count.textContent = '';
    if (!st.total) {
      count.textContent = '清單未有項目';
    } else if (st.done === st.total) {
      count.appendChild(h('b', { text: '執齊晒，出發！' }));
    } else {
      count.appendChild(document.createTextNode('執好 '));
      count.appendChild(h('b', { text: String(st.done) }));
      count.appendChild(document.createTextNode(' / ' + st.total + ' 件'));
    }
    $('fill').style.width = pct + '%';
    if (pct) $('fill').removeAttribute('data-zero'); else $('fill').setAttribute('data-zero', '');
    $('pawn').style.left = pct + '%';
    $('bar').style.setProperty('--pct', pct);
    $('track').setAttribute('aria-valuenow', pct);
  }

  function renderJump() {
    jumpEl.textContent = '';
    S.cats.forEach(function (c) {
      var st = catState(c);
      jumpEl.appendChild(h('button', {
        type: 'button',
        class: 'chip' + (st.full ? ' full' : '') + (st.allSkip ? ' skipped' : ''),
        text: c.name,
        onclick: function () {
          if (c.fold) { c.fold = false; touch(); render(); }
          var el = $('cat-' + c.id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }));
    });
  }

  function renderItem(cat, it) {
    if (ui.edit) {
      return h('li', { class: 'item editing' },
        h('input', {
          class: 'name-input', type: 'text', maxlength: 80, value: it.name, 'aria-label': '項目名稱',
          onchange: function () {
            var v = this.value.replace(/\s+/g, ' ').trim();
            if (!v) { this.value = it.name; return; }
            it.name = v; this.value = v; touch();
          }
        }),
        h('button', {
          type: 'button', class: 'mini danger', text: '刪除', 'aria-label': '刪除 ' + it.name,
          onclick: function () {
            undoable('已刪除「' + it.name + '」', function () {
              cat.items = cat.items.filter(function (x) { return x !== it; });
            });
          }
        })
      );
    }

    var li = h('li', { class: 'item' + (it.done ? ' done' : '') + (it.skip ? ' skip' : '') });
    var cb = h('input', { type: 'checkbox', checked: it.done && !it.skip, disabled: it.skip });
    cb.checked = !!it.done && !it.skip;
    cb.addEventListener('change', function () {
      it.done = cb.checked;
      li.classList.toggle('done', it.done);
      touch(); renderHeader(); renderJump(); updateCatNum(cat);
      if (ui.filter === 'todo') scheduleRender();
    });
    li.appendChild(h('label', null, cb, h('span', { class: 'box', 'aria-hidden': 'true' }), h('span', { class: 'item-name', text: it.name })));
    // 右邊的小按鈕：一按標記／取消「今次唔帶」（不計入進度）
    var skipBtn = h('button', {
      type: 'button', class: 'skip-btn', 'aria-pressed': it.skip ? 'true' : 'false',
      'aria-label': '今次唔帶：' + it.name, title: '今次唔帶',
      onclick: function () {
        it.skip = !it.skip;
        if (it.skip) delete it.done;
        touch();
        li.parentNode.replaceChild(renderItem(cat, it), li);
        renderHeader(); renderJump(); updateCatNum(cat);
        if (ui.filter === 'todo') scheduleRender();
      }
    });
    if (it.skip) skipBtn.appendChild(h('span', { text: '今次唔帶' }));
    else skipBtn.innerHTML = SKIP_ICON;
    li.appendChild(skipBtn);
    return li;
  }

  function updateCatNum(cat) {
    var el = $('cat-' + cat.id);
    if (!el) return;
    var st = catState(cat);
    el.classList.toggle('full', st.full);
    el.classList.toggle('skipped', st.allSkip);
    var num = el.querySelector('.cat-num');
    if (num) num.textContent = st.label;
    var btn = el.querySelector('.cat-head .skip-btn');
    if (btn) btn.setAttribute('aria-pressed', st.allSkip ? 'true' : 'false');
  }

  function renderCat(cat) {
    var st = catState(cat);
    var full = st.full;
    var todoOnly = ui.filter === 'todo' && !ui.edit;
    if (todoOnly && cat.items.length && st.done === st.total) return null;

    var sec = h('section', { class: 'cat tile' + (cat.fold && !ui.edit ? ' folded' : '') + (full ? ' full' : '') + (st.allSkip ? ' skipped' : ''), id: 'cat-' + cat.id });

    if (ui.edit) {
      sec.appendChild(h('div', { class: 'cat-head editing' },
        h('input', {
          class: 'name-input', type: 'text', maxlength: 80, value: cat.name, 'aria-label': '分類名稱',
          onchange: function () {
            var v = this.value.replace(/\s+/g, ' ').trim();
            if (!v) { this.value = cat.name; return; }
            cat.name = v; this.value = v; touch(); renderJump();
          }
        }),
        h('button', {
          type: 'button', class: 'mini danger', text: '刪除分類',
          onclick: function () {
            undoable('已刪除分類「' + cat.name + '」（' + cat.items.length + ' 個項目）', function () {
              S.cats = S.cats.filter(function (x) { return x !== cat; });
            });
          }
        })
      ));
    } else {
      sec.appendChild(h('div', { class: 'cat-head' },
        h('button', {
          type: 'button', class: 'cat-toggle', 'aria-expanded': cat.fold ? 'false' : 'true',
          onclick: function () {
            cat.fold = !cat.fold;
            sec.classList.toggle('folded', cat.fold);
            this.setAttribute('aria-expanded', cat.fold ? 'false' : 'true');
            touch();
          }
        }, h('span', { class: 'chev', 'aria-hidden': 'true' }), h('span', { class: 'cat-name', text: cat.name })),
        cat.items.length ? (function () {
          var btn = h('button', {
            type: 'button', class: 'skip-btn', 'aria-pressed': st.allSkip ? 'true' : 'false',
            'aria-label': '整個分類今次唔帶：' + cat.name, title: '整個分類今次唔帶',
            onclick: function () {
              var now = catState(cat);
              if (now.allSkip) {
                undoable('「' + cat.name + '」已恢復', function () {
                  cat.items.forEach(function (it) { delete it.skip; });
                  cat.fold = false;
                });
              } else {
                undoable('「' + cat.name + '」整個分類今次唔帶', function () {
                  cat.items.forEach(function (it) { it.skip = true; delete it.done; });
                  cat.fold = true;                       // 順手收起，減少畫面長度
                });
              }
            }
          });
          btn.innerHTML = SKIP_ICON;
          return btn;
        })() : null,
        h('span', { class: 'cat-num', text: st.label })
      ));
    }

    var body = h('div', { class: 'cat-body' });
    var ul = h('ul', { class: 'items' });
    cat.items.forEach(function (it) {
      if (todoOnly && (it.done || it.skip)) return;
      ul.appendChild(renderItem(cat, it));
    });
    body.appendChild(ul);

    var input = h('input', { type: 'text', maxlength: 80, placeholder: '新增項目', 'aria-label': '新增項目到 ' + cat.name });
    body.appendChild(h('form', {
      class: 'add', autocomplete: 'off',
      onsubmit: function (e) {
        e.preventDefault();
        var v = input.value.replace(/\s+/g, ' ').trim();
        if (!v) return;
        cat.items.push({ id: uid(), name: v });
        touch(); render();
        var again = document.querySelector('#cat-' + cat.id + ' .add input');   // 保持游標，方便連續新增
        if (again) again.focus();
      }
    }, h('span', { class: 'add-plus', 'aria-hidden': 'true', text: '＋' }), input, h('button', { type: 'submit', text: '加入' })));

    sec.appendChild(body);
    return sec;
  }

  var renderTimer = null;
  function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 450); }

  function render() {
    clearTimeout(renderTimer);
    renderHeader(); renderJump();
    listEl.textContent = '';
    var shown = 0;
    S.cats.forEach(function (c) { var el = renderCat(c); if (el) { listEl.appendChild(el); shown++; } });

    if (!S.cats.length) {
      listEl.appendChild(h('div', { class: 'state' }, h('strong', { text: '清單是空的' }), '在下面新增第一個分類，或從選單還原預設清單。'));
    } else if (!shown) {
      listEl.appendChild(h('div', { class: 'state' }, h('strong', { text: '全部執好' }), '沒有未執的項目。',
        h('div', null, h('button', { type: 'button', class: 'btn', text: '顯示全部', onclick: function () { setFilter('all'); } }))));
    }
    $('addCat').hidden = false;
  }

  /* ───────── 工具列 ───────── */
  function setFilter(f) {
    ui.filter = f;
    $('fAll').setAttribute('aria-pressed', f === 'all' ? 'true' : 'false');
    $('fTodo').setAttribute('aria-pressed', f === 'todo' ? 'true' : 'false');
    render();
  }
  $('fAll').addEventListener('click', function () { setFilter('all'); });
  $('fTodo').addEventListener('click', function () { setFilter('todo'); });

  $('editBtn').addEventListener('click', function () {
    ui.edit = !ui.edit;
    this.setAttribute('aria-pressed', ui.edit ? 'true' : 'false');
    this.textContent = ui.edit ? '完成' : '編輯';
    render();
  });

  $('addCat').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = this.querySelector('input');
    var v = input.value.replace(/\s+/g, ' ').trim();
    if (!v) return;
    var cat = { id: uid(), name: v, items: [] };
    S.cats.push(cat);
    input.value = '';
    touch(); render();
    var next = document.querySelector('#cat-' + cat.id + ' .add input');
    if (next) { next.focus(); next.scrollIntoView({ block: 'center' }); }
  });

  /* ───────── 選單 ───────── */
  var menu = $('menu');
  function anyOpen() { return S.cats.some(function (c) { return !c.fold; }); }
  $('menuBtn').addEventListener('click', function () {
    $('foldToggle').textContent = anyOpen() ? '收起全部分類' : '展開全部分類';
    if (menu.showModal) menu.showModal(); else menu.setAttribute('open', '');
  });
  function closeMenu() { if (menu.close) menu.close(); else menu.removeAttribute('open'); }
  menu.addEventListener('click', function (e) {
    if (e.target === menu) return closeMenu();           // 按背景關閉
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    closeMenu();
    var act = btn.dataset.act;
    if (act === 'newTrip') {
      undoable('已清除剔號。用不著的項目，按右邊 ⊘ 標記「今次唔帶」', function () {
        S.cats.forEach(function (c) { c.items.forEach(function (it) { delete it.done; delete it.skip; }); });
      });
    } else if (act === 'sort') {
      openSorter();
    } else if (act === 'foldToggle') {
      var fold = anyOpen();
      S.cats.forEach(function (c) { c.fold = fold; });
      touch(); render();
    } else if (act === 'logout') {
      if (dirty && ui.loaded) call('saveList', S);        // 登出前把未儲存的改動送出
      dirty = false; clearTimeout(saveTimer);
      showAuth('');
    } else if (act === 'restore') {
      call('getDefaultList').then(function (def) {
        undoable('已還原預設清單', function () { S = def; });
      }, function () { toast('讀取預設清單失敗，請再試一次'); });
    }
  });

  /* ───────── 排列分類 ───────── */
  var sorter = $('sorter');
  function renderSorter(movedId, focusSel) {
    var ol = $('sortList');
    ol.textContent = '';
    S.cats.forEach(function (cat, i) {
      function mover(label, aria, cls, to, disabled) {
        return h('button', {
          type: 'button', class: 'mini ' + cls, text: label, 'aria-label': aria + '：' + cat.name, disabled: disabled,
          onclick: function () {
            S.cats.splice(i, 1);
            S.cats.splice(to, 0, cat);
            touch();
            renderSorter(cat.id, '.' + cls);
          }
        });
      }
      ol.appendChild(h('li', { class: 'sort-row' + (cat.id === movedId ? ' moved' : ''), 'data-id': cat.id },
        h('span', { class: 'sort-name', text: cat.name }),
        mover('置頂', '移到最上', 'mv-top', 0, i === 0),
        mover('▲', '上移', 'mv-up', i - 1, i === 0),
        mover('▼', '下移', 'mv-down', i + 1, i === S.cats.length - 1)
      ));
    });
    if (movedId) {
      var row = ol.querySelector('[data-id="' + movedId + '"]');
      if (row) {
        row.scrollIntoView({ block: 'nearest' });
        var btn = row.querySelector(focusSel);
        if (btn && !btn.disabled) btn.focus();
      }
    }
  }
  function openSorter() {
    renderSorter();
    if (sorter.showModal) sorter.showModal(); else sorter.setAttribute('open', '');
  }
  function closeSorter() {
    if (sorter.close) sorter.close(); else sorter.removeAttribute('open');
  }
  $('sorterDone').addEventListener('click', closeSorter);
  sorter.addEventListener('click', function (e) { if (e.target === sorter) closeSorter(); });
  sorter.addEventListener('close', render);      // 關閉後按新次序重畫主畫面

  /* 工具列貼頂時加底線 */
  if ('IntersectionObserver' in window) {
    var sentinel = h('div');
    $('bar').parentNode.insertBefore(sentinel, $('bar'));
    new IntersectionObserver(function (entries) {
      $('bar').classList.toggle('stuck', !entries[0].isIntersecting);
    }).observe(sentinel);
  }

  /* ───────── 登入 ───────── */
  var mode = 'login', cfg = { invite: false, minPass: 6 };

  function errText(err) {
    return String((err && err.message) || err || '').replace(/^Error:\s*/, '').replace(/^AUTH：/, '') || '發生錯誤，請再試一次。';
  }
  function isAuthError(err) { return /AUTH：/.test(String((err && err.message) || err || '')); }

  function remember(a) {
    try { if (a) localStorage.setItem(STORE_KEY, JSON.stringify(a)); else localStorage.removeItem(STORE_KEY); } catch (e) {}
  }
  function recall() {
    try { var a = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); return a && a.user && a.token ? a : null; } catch (e) { return null; }
  }

  function setMode(m) {
    mode = m;
    $('mLogin').setAttribute('aria-pressed', m === 'login' ? 'true' : 'false');
    $('mReg').setAttribute('aria-pressed', m === 'register' ? 'true' : 'false');
    $('aSubmit').textContent = m === 'login' ? '登入' : '建立我的清單';
    $('aPass').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
    $('inviteRow').hidden = !(m === 'register' && cfg.invite);
    $('aHint').textContent = m === 'login'
      ? '忘記密碼？請找 Tom 幫你重設。'
      : '密碼最少 ' + cfg.minPass + ' 個字。請不要用你其他帳戶（例如銀行、電郵）的密碼。';
    $('aErr').textContent = '';
  }
  $('mLogin').addEventListener('click', function () { setMode('login'); });
  $('mReg').addEventListener('click', function () { setMode('register'); });

  function showAuth(msg) {
    auth = null; remember(null);
    ui.loaded = false; ui.edit = false;
    S = { v: 1, cats: [] };
    $('editBtn').setAttribute('aria-pressed', 'false'); $('editBtn').textContent = '編輯';
    document.body.dataset.view = 'auth';
    $('aPass').value = '';
    setMode(mode);
    $('aErr').textContent = msg || '';
    window.scrollTo(0, 0);
  }

  $('authForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var btn = $('aSubmit');
    var req = { user: $('aUser').value, pass: $('aPass').value, invite: $('aInvite').value };
    if (mode === 'register' && req.pass.length < cfg.minPass) { $('aErr').textContent = '密碼最少要 ' + cfg.minPass + ' 個字。'; return; }
    btn.disabled = true; $('aErr').textContent = '';
    var label = btn.textContent; btn.textContent = '請稍候…';
    call(mode, req).then(function (res) {
      btn.disabled = false; btn.textContent = label;
      auth = { user: res.user, token: res.token };
      remember(auth);
      enterApp();
    }, function (err) {
      btn.disabled = false; btn.textContent = label;
      $('aErr').textContent = errText(err);
    });
  });

  function enterApp() {
    document.body.dataset.view = 'app';
    $('aPass').value = '';
    $('whoami').textContent = '現在是：' + auth.user;
    load();
  }

  /* ───────── 啟動 ───────── */
  function load() {
    $('count').textContent = '載入中…';
    listEl.textContent = '';
    listEl.appendChild(h('div', { class: 'state', text: '載入你的清單…' }));
    call('getList').then(function (data) {
      S = data && Array.isArray(data.cats) ? data : { v: 1, cats: [] };
      ui.loaded = true;
      setSave('saved');
      render();
    }, function (err) {
      if (isAuthError(err)) return showAuth(errText(err));
      listEl.textContent = '';
      $('count').textContent = '未能載入';
      listEl.appendChild(h('div', { class: 'state' },
        h('strong', { text: '載入失敗' }),
        errText(err),
        h('div', null,
          h('button', { type: 'button', class: 'btn', text: '再試一次', onclick: load }), ' ',
          h('button', {
            type: 'button', class: 'btn', text: '用預設清單重新開始',
            onclick: function () {
              call('getDefaultList').then(function (def) { S = def; ui.loaded = true; touch(); render(); });
            }
          }))));
    });
  }

  if (!live) $('demoNote').hidden = false;
  setMode('login');
  call('getConfig').then(function (c) { if (c) { cfg = c; setMode(mode); } }, function () {});
  auth = live ? recall() : null;
  if (auth) enterApp();
})();
</script>
